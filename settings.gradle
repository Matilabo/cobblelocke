pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads a JDK 21 into ~/.gradle/jdks when none is installed, so the build does not
    // depend on whichever Java happens to be on the machine.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'cobblelocke'
